
services:
  - type: web
    name: shl-assessment-api
    env: python
    runtime: python
    pythonVersion: 3.11.9

    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: >
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --log-level info

    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: models/gemini-flash-latest

      - key: GEMINI_TEMPERATURE
        value: "0.2"

      - key: GEMINI_MAX_TOKENS
        value: "2048"

      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      - key: SHL_CSV_PATH
        value: shl_catalog.csv

      - key: SHL_INDEX_PATH
        value: shl_index.faiss

